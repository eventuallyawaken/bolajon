name: Build Bolajon ERP Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'mobile/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: TypeScript and code audit
        run: |
          npx tsc --noEmit
          node scripts/audit.js

      - name: Generate Android native project
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL || 'http://192.168.43.153:5000/api' }}
          EXPO_PUBLIC_USE_MOCK: 'false'
        run: npx expo prebuild --platform android --non-interactive

      - name: Build Android Release APK
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL || 'http://192.168.43.153:5000/api' }}
          EXPO_PUBLIC_USE_MOCK: 'false'
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Prepare APK artifact
        run: |
          mkdir -p ../release-artifacts
          cp android/app/build/outputs/apk/release/app-release.apk ../release-artifacts/bolajon-erp-android.apk

      - name: Upload APK to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bolajon-erp-android-apk
          path: release-artifacts/bolajon-erp-android.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Bolajon ERP Android v1.0.${{ github.run_number }}
          body: |
            **Bolajon ERP Mobil Ilova (Android APK)**
            - Ota-ona va Tarbiyachi interfeyslari
            - Web sayt bilan bir xil Light/Dark dizayn (`tokens.css`)
            - Real Backend & PostgreSQL integratsiyasi (hamda ilova ichidan Server URL sozlash imkoniyati)
          files: release-artifacts/bolajon-erp-android.apk
